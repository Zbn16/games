<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
  <title>DOPA - Games</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --background: #000;
      --surface: rgba(20, 20, 20, 0.9);
      --card: rgba(20, 20, 20, 0.85);
      --text: #620000;
      --accent: #6c0000;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--background);
      color: var(--text);
      font-family: "Cal Sans", Arial, sans-serif;
      font-weight: bold;
      user-select: none;
      overflow-y: auto;
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--surface);
      box-shadow: 0 2px 10px var(--accent);
    }

    header h1 {
      color: var(--text);
      font-size: 2.5rem;
      letter-spacing: 3px;
      text-shadow: 3px 3px 0 rgba(109, 2, 2, 0.45);
    }

    .search-container {
      flex: 1;
      max-width: 400px;
    }

    .search-container input {
      width: 100%;
      padding: 11px 12px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      outline: none;
      background: #111;
      color: #e0e0e0;
      font: inherit;
    }

    .search-container input:focus {
      box-shadow: 0 0 8px var(--accent);
    }

    .search-container input::placeholder {
      color: #a77;
    }

    .btn {
      padding: 10px 20px;
      border: 2px solid var(--accent);
      border-radius: 6px;
      background: #000;
      color: var(--text);
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(108, 0, 0, 0.7);
      transition: background 0.3s ease, color 0.3s ease, transform 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      background: var(--accent);
      color: #000;
    }

    .main-content {
      width: min(90%, 1200px);
      margin: 24px auto;
      padding: 24px;
      flex: 1;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 2px 10px rgba(108, 0, 0, 0.65);
    }

    .tagline {
      margin-bottom: 16px;
      color: var(--text);
      font-size: 1.35rem;
      text-align: center;
    }

    .section {
      margin: 28px 0;
    }

    .section h2 {
      margin-bottom: 16px;
      padding-bottom: 7px;
      border-bottom: 2px solid var(--accent);
      color: var(--text);
      font-size: 2rem;
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 18px;
    }

    .game {
      overflow: hidden;
      width: 100%;
      border: 1px solid rgba(108, 0, 0, 0.8);
      border-radius: 10px;
      background: var(--card);
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(108, 0, 0, 0.65);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .game:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 5px 5px 0 var(--accent);
    }

    .game img {
      display: block;
      width: 100%;
      height: 110px;
      object-fit: cover;
    }

    .game-title {
      min-height: 44px;
      padding: 10px;
      display: grid;
      place-items: center;
      background: rgba(20, 20, 20, 0.95);
      color: var(--text);
      text-align: center;
    }

    .no-data {
      margin-top: 20px;
      color: #888;
      font-style: italic;
      text-align: center;
    }

    footer {
      width: 100%;
      padding: 20px;
      background: var(--surface);
      border-top: 1px solid var(--accent);
      color: var(--text);
      text-align: center;
    }

    .social-icons {
      margin-top: 10px;
    }

    a:focus-visible,
    button:focus-visible,
    .game:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 4px;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 16px;
        flex-wrap: wrap;
        gap: 12px;
      }

      header h1 {
        font-size: 2rem;
      }

      .search-container {
        order: 3;
        flex-basis: 100%;
        max-width: none;
      }

      .main-content {
        width: 94%;
        padding: 16px;
      }

      .section h2 {
        font-size: 1.6rem;
      }

      .games-container {
        grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
        gap: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>DOPA</h1>
    <div class="search-container">
      <input
        type="search"
        id="search"
        oninput="filterGames()"
        placeholder="Search for games..."
        aria-label="Search games"
      >
    </div>
    <a class="btn" href="/">Home</a>
  </header>

  <main class="main-content">
    <div class="tagline">“Using Universal's Game Engine”</div>
    <div class="tagline">“We update so much... sh- should we update more?”</div>

    <section class="section" id="most-popular">

      <div class="games-container" id="popular-games-container"></div>
    </section>

    <section class="section" id="all-games">
      <h2>All Games</h2>
      <div class="games-container" id="all-games-container"></div>
    </section>

    <section class="section" id="recommended-games">
      <h2>Games You've Played Recently</h2>
      <div class="games-container" id="recommendedContainer"></div>
      <div id="no-data-message" class="no-data">No data collected yet.</div>
    </section>
  </main>

  <footer>
    <div class="credits">© 2025 DOPA. All Rights Reserved.</div>
    <div class="social-icons">

        class="btn"
        type="button"
        onclick="window.open('https://www.youtube.com/', '_blank', 'noopener,noreferrer')"
      >🔴 YouTube</button>
    </div>
  </footer>

    ];

    const popularGameIds = [
      'a-shedletsky-pov',
      'block-blast',
      'slope',
      'buckshot-roulette'
    ];

    let recentGames = [];

    try {
      const savedGames = JSON.parse(localStorage.getItem('recentGames') || '[]');
      if (Array.isArray(savedGames)) {
        recentGames = savedGames.filter(id => games.some(game => game.id === id)).slice(0, 4);
      }
    } catch (error) {
      recentGames = [];
    }

    function createGameCard(game) {
      const card = document.createElement('div');
      card.className = 'game';
      card.tabIndex = 0;
      card.setAttribute('role', 'link');
      card.setAttribute('aria-label', `Play ${game.title}`);

      const image = document.createElement('img');
      image.src = game.image;
      image.alt = game.title;
      image.loading = 'lazy';

      const title = document.createElement('div');
      title.className = 'game-title';
      title.textContent = game.title;

      card.append(image, title);
      card.addEventListener('click', () => playGame(game.id));
      card.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          playGame(game.id);
        }
      });

      return card;
    }

    function playGame(gameId) {
      recentGames = [gameId, ...recentGames.filter(id => id !== gameId)].slice(0, 4);
      localStorage.setItem('recentGames', JSON.stringify(recentGames));
      window.location.href = `/${gameId}`;
    }

    function loadPopularGames() {
      const container = document.getElementById('popular-games-container');
      const popularGames = popularGameIds
        .map(id => games.find(game => game.id === id))
        .filter(Boolean);

      popularGames.forEach(game => container.appendChild(createGameCard(game)));
    }

    function loadAllGames() {
      const container = document.getElementById('all-games-container');
      games.forEach(game => container.appendChild(createGameCard(game)));
    }

    function recommendGames() {
      const container = document.getElementById('recommendedContainer');
      const noDataMessage = document.getElementById('no-data-message');
      const recommended = recentGames
        .map(id => games.find(game => game.id === id))
        .filter(Boolean);

      container.replaceChildren();
      noDataMessage.style.display = recommended.length ? 'none' : 'block';

      recommended.forEach(game => container.appendChild(createGameCard(game)));
    }

    function filterGames() {
      const searchTerm = document.getElementById('search').value.trim().toLowerCase();

      document.querySelectorAll('.game').forEach(card => {
        const title = card.querySelector('.game-title').textContent.toLowerCase();
        card.style.display = title.includes(searchTerm) ? '' : 'none';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPopularGames();
      loadAllGames();
      recommendGames();
    });
